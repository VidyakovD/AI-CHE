<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
<script>
(function(){try{
  var V='aiche-v6-2026-05-16-personal';
  var stored=localStorage.getItem('aiche_client_version');
  if(stored===V) return;
  if(!('serviceWorker' in navigator)){localStorage.setItem('aiche_client_version',V);return;}
  var loopGuard=sessionStorage.getItem('aiche_bootstrap_inflight');
  if(loopGuard){localStorage.setItem('aiche_client_version',V);sessionStorage.removeItem('aiche_bootstrap_inflight');return;}
  sessionStorage.setItem('aiche_bootstrap_inflight','1');
  navigator.serviceWorker.getRegistrations().then(function(regs){
    return Promise.all(regs.map(function(r){return r.unregister();}));
  }).then(function(){
    if(!self.caches)return null;
    return caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){return caches.delete(k);}));
    });
  }).then(function(){
    localStorage.setItem('aiche_client_version',V);
    location.reload();
  }).catch(function(){localStorage.setItem('aiche_client_version',V);sessionStorage.removeItem('aiche_bootstrap_inflight');});
}catch(e){}})();
</script>

<div class="app">
  <header class="hdr">
    <div class="left">
      <a href="/" class="btn-g" title="На главную" style="font-size:13px">←</a>
      <span class="ic" id="agentIcon">🤖</span>
      <div style="min-width:0">

        <div class="st"><span class="dot" id="statusDot"></span><span id="statusLabel">—</span></div>

<!-- Catalog modal -->
<div id="catalogModal" class="modal-bg">
  <div style="background:#1e1a14;border:1.5px solid rgba(74,63,47,.4);border-radius:16px;padding:20px;max-width:720px;width:100%" onclick="event.stopPropagation()">

<!-- Profile edit modal -->
<div id="profileModal" class="modal-bg">

      <button class="btn-p" onclick="saveProfileEdit()">Сохранить</button>
    </div>
  </div>

<script>
// Абсолютный origin — relative-fetch иногда ломается в PWA-контексте
// (ошибка "Failed to parse URL from /api/agents/me"). Префиксим всегда.
const API = window.location.origin;
let _agent = null;
let _modules = [];
let _catalog = [];

function _esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function loadBalance(){
  try{
    const r = await fetch(`${API}/auth/me`,{credentials:'same-origin'});
    if(!r.ok)return;
    const me = await r.json();
    const bal = me.tokens_balance||0;
    document.getElementById('balancePill').textContent = `Баланс: ${(window.fmtRub?window.fmtRub(bal):(bal/100).toFixed(2)+' ₽')}`;
  }catch(e){}
}

// ── Agent ────────────────────────────────────────────────────────────────
async function loadAgent(){
  try{
    const r = await fetch(`${API}/api/agents/me`,{credentials:'same-origin'});
    if(r.status===401){renderNotAuth();return false;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    _agent = await r.json();
    renderHeader();
    renderProfile();
    return true;
  }catch(e){
    document.getElementById('chatFeed').innerHTML = `<div class="msg system">Не удалось загрузить агента: ${_esc(e.message)}</div>`;
    return false;
  }
}

function renderNotAuth(){
  document.getElementById('agentName').textContent = '🔒 Требуется вход';
  document.getElementById('chatFeed').innerHTML = `
    <div style="text-align:center;padding:60px 20px;color:#a89880">
      <div style="font-size:48px;margin-bottom:14px">🔒</div>
      <div style="font-size:16px;margin-bottom:14px">Чтобы общаться с агентом — нужно войти</div>
      <a href="/" class="btn-p" style="display:inline-block;text-decoration:none">На главную → войти</a>
    </div>`;
  document.querySelector('.aside').innerHTML = '';
  document.querySelector('.chat-input-row').style.display = 'none';
}

function renderHeader(){
  document.getElementById('agentIcon').textContent = _agent.icon || '🤖';
  document.getElementById('agentName').textContent = _agent.name || 'Че';
  const st = _agent.status || 'onboarding';
  const dot = document.getElementById('statusDot');
  dot.className = 'dot '+st;
  const lbl = {onboarding:'Знакомимся', active:'Активен', paused:'На паузе'}[st] || st;
  const modCount = _agent.modules_count || 0;
  document.getElementById('statusLabel').textContent = lbl + ' · ' + modCount + ' модулей';
  const tc = document.getElementById('asideToggleCount');
  if(tc) tc.textContent = modCount;
}

function renderProfile(){
  const box = document.getElementById('profileBlock');
  const p = _agent.profile || {};
  const facts = p.facts || [];
  const lines = [];
  for(const k of ['name','industry','tone','goals']){
    if(p[k]){
      const lbl = {name:'Имя', industry:'Сфера', tone:'Стиль', goals:'Цели'}[k];
      lines.push(`<div class="profile-fact"><span class="k">${lbl}</span>${_esc(p[k])}</div>`);
    }
  }
  for(const f of (facts||[]).slice(-8).reverse()){
    if(f && f.value){
      lines.push(`<div class="profile-fact"><span class="k">${_esc(f.key||'факт')}</span>${_esc(f.value)}</div>`);
    }
  }
  box.innerHTML = lines.length ? lines.join('') : '<div class="profile-empty">Агент ещё ничего о тебе не знает. Поговорите — он запомнит.</div>';
}

// ── Modules ──────────────────────────────────────────────────────────────
async function loadModules(){
  try{
    const r = await fetch(`${API}/api/agents/me/modules`,{credentials:'same-origin'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data = await r.json();
    _modules = data.modules||[];
    renderModules();
  }catch(e){
    document.getElementById('modulesBlock').innerHTML = `<div class="profile-empty">Ошибка: ${_esc(e.message)}</div>`;
  }
}

function renderModules(){
  const box = document.getElementById('modulesBlock');
  if(!_modules.length){
    box.innerHTML = '<div class="mod-empty">Пока без модулей.<br/>Подключи навыки агенту ниже.</div>';
    return;
  }
  box.innerHTML = _modules.map(m => `
    <div class="mod-card ${m.is_enabled?'':'off'}">
      <div class="nm" title="${_esc(m.description||m.slug)}">${_esc(m.name||m.slug)}</div>
      <div class="lvl L${m.level}">L${m.level}</div>
      <button class="x" onclick="disconnectModule('${_esc(m.slug)}')" title="Отключить">✕</button>
    </div>`).join('');
}

async function disconnectModule(slug){
  if(!confirm(`Отключить модуль «${slug}»? Память модуля удалится.`))return;
  try{
    const r = await fetch(`${API}/api/agents/me/modules/${encodeURIComponent(slug)}`,{
      method:'DELETE', credentials:'same-origin',
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    await loadModules();
    await loadAgent();
    await loadMessages();  // подхватим system-message
  }catch(e){
    alert('Не удалось отключить: '+e.message);
  }
}

// ── Catalog ──────────────────────────────────────────────────────────────
function openCatalog(){
  document.getElementById('catalogModal').classList.add('show');
  loadCatalog();
}
function closeCatalog(){document.getElementById('catalogModal').classList.remove('show');}

document.getElementById('catalogModal').addEventListener('click', e=>{
  if(e.target===document.getElementById('catalogModal'))closeCatalog();
});

async function loadCatalog(){
  const grid = document.getElementById('catalogGrid');
  try{
    const r = await fetch(`${API}/api/agents/catalog`,{credentials:'same-origin'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data = await r.json();
    _catalog = data.modules||[];
    renderCatalog('');
  }catch(e){
    grid.innerHTML = `<div class="profile-empty">Ошибка: ${_esc(e.message)}</div>`;
  }
}

function renderCatalog(q){
  const grid = document.getElementById('catalogGrid');
  q = (q||'').toLowerCase().trim();
  let items = _catalog;
  if(q){
    items = _catalog.filter(m =>
      (m.name||'').toLowerCase().includes(q) ||
      (m.slug||'').toLowerCase().includes(q) ||
      (m.description||'').toLowerCase().includes(q) ||
      (m.keywords||[]).some(k => k.toLowerCase().includes(q))
    );
  }
  if(!items.length){
    grid.innerHTML = `<div class="profile-empty">Ничего не найдено по «${_esc(q)}»</div>`;
    return;
  }
  grid.innerHTML = items.map(m => `
    <div class="cat-item ${m.is_connected?'connected':''}" data-slug="${_esc(m.slug)}">
      <div class="nm">${_esc(m.name||m.slug)}</div>
      <div class="d">${_esc(m.description||'')}</div>
      ${m.is_connected ? '<span class="badge">✓ Подключён</span>' : ''}
    </div>`).join('');
  grid.querySelectorAll('.cat-item:not(.connected)').forEach(el => {
    el.addEventListener('click', () => connectModule(el.dataset.slug));
  });
}

document.getElementById('catSearch').addEventListener('input', e => renderCatalog(e.target.value));

async function connectModule(slug){
  try{
    const r = await fetch(`${API}/api/agents/me/modules`,{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({slug}),
    });
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      throw new Error(d.detail||'HTTP '+r.status);
    }
    closeCatalog();
    await loadModules();
    await loadAgent();
    await loadMessages();
  }catch(e){
    alert('Не удалось подключить: '+e.message);
  }
}

// ── Messages ─────────────────────────────────────────────────────────────
async function loadMessages(){
  const feed = document.getElementById('chatFeed');
  try{
    const r = await fetch(`${API}/api/agents/me/messages`,{credentials:'same-origin'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data = await r.json();
    feed.innerHTML = '';
    (data.messages||[]).forEach(m => feed.appendChild(_msgEl(m)));
    feed.scrollTop = feed.scrollHeight;
  }catch(e){
    feed.innerHTML = `<div class="msg system">Ошибка загрузки: ${_esc(e.message)}</div>`;
  }
}

function _msgEl(m){
  const div = document.createElement('div');
  const role = m.role || 'assistant';
  div.className = 'msg '+role;
  // Сообщения от модулей — header с slug + level + level-up badge
  if(role === 'tool' && m.meta){
    const meta = m.meta || {};
    const slug = meta.slug || 'модуль';
    const level = (meta.level != null) ? meta.level : 0;
    const levelUp = meta.level_up;
    const hdr = document.createElement('div');
    hdr.className = 'tool-hdr';
    hdr.innerHTML = `🧩 ${_esc(slug)} <span class="lvl">L${level}</span>` +
      (levelUp ? ` <span class="levelup">⬆ повышен!</span>` : '');
    div.appendChild(hdr);
    const body = document.createElement('div');
    body.textContent = m.content || '';
    div.appendChild(body);
  } else {
    div.textContent = m.content || '';
  }
  return div;
}

function _suggestRow(suggestSlugs){
  if(!suggestSlugs || !suggestSlugs.length) return null;
  const row = document.createElement('div');
  row.className = 'suggest-row';
  const label = document.createElement('span');
  label.style = 'font-size:11px;color:#a89880;align-self:center;margin-right:4px';
  label.textContent = '⚡ Подключить:';
  row.appendChild(label);
  suggestSlugs.forEach(slug => {
    const chip = document.createElement('button');
    chip.className = 'suggest-chip';
    chip.textContent = slug;
    chip.addEventListener('click', () => connectModule(slug));
    row.appendChild(chip);
  });
  return row;
}

// ── Aside drawer (mobile) ────────────────────────────────────────────────
function toggleAside(){
  const a = document.querySelector('.aside');
  const b = document.getElementById('asideBackdrop');
  if(a.classList.contains('open')){closeAside();} else {a.classList.add('open');b.classList.add('show');}
}
function closeAside(){
  document.querySelector('.aside').classList.remove('open');
  document.getElementById('asideBackdrop').classList.remove('show');
}

async function sendMessage(){
  const ta = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const text = (ta.value||'').trim();
  if(!text || !_agent)return;
  ta.value=''; ta.style.height='auto';
  btn.disabled=true;
  const feed = document.getElementById('chatFeed');
  feed.appendChild(_msgEl({role:'user', content:text}));
  feed.scrollTop = feed.scrollHeight;
  const typing = document.createElement('div');
  typing.className='msg assistant';
  typing.textContent='⌛ агент думает...';
  feed.appendChild(typing);
  feed.scrollTop = feed.scrollHeight;
  try{
    const r = await fetch(`${API}/api/agents/me/messages`,{
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({content: text}),
    });
    typing.remove();
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      feed.appendChild(_msgEl({role:'system', content:'Ошибка: '+(d.detail||r.status)}));
    }else{
      const data = await r.json();
      if(data.assistant_message) feed.appendChild(_msgEl(data.assistant_message));
      // Suggest-chips для не подключённых модулей которые агент рекомендует
      const suggested = data.assistant_message?.meta?.suggest_modules || [];
      const connectedSlugs = new Set((_modules||[]).map(m=>m.slug));
      const filtered = suggested.filter(s => !connectedSlugs.has(s));
      if(filtered.length){
        const row = _suggestRow(filtered);
        if(row) feed.appendChild(row);
      }
      // module_message — отдельное сообщение от модуля который агент дернул
      if(data.module_message){
        feed.appendChild(_msgEl(data.module_message));
        // level_up → подсветка + обновляем sidebar модулей
        if(data.module_message?.meta?.level_up){
          feed.appendChild(_msgEl({role:'system',
            content:`⬆ Модуль ${data.module_message.meta.slug} прокачался до L${data.module_message.meta.level}!`}));
        }
        // Перезагружаем список модулей (interaction_count + level могли измениться)
        loadModules();
      }
      if(data.agent){
        _agent = data.agent;
        renderHeader();
        renderProfile();
        if(data.assistant_message?.meta?.activated){
          feed.appendChild(_msgEl({role:'system', content:'🎉 Онбординг закончен — я перешёл в рабочий режим. Готов наращивать модули.'}));
        }
      }
    }
    feed.scrollTop = feed.scrollHeight;
  }catch(e){
    typing.remove();
    feed.appendChild(_msgEl({role:'system', content:'Сеть недоступна: '+e.message}));
  }finally{
    btn.disabled=false; ta.focus();
  }
}

// Auto-grow textarea
const chatTa = document.getElementById('chatInput');
chatTa.addEventListener('input', () => {
  chatTa.style.height = 'auto';
  chatTa.style.height = Math.min(chatTa.scrollHeight, 160) + 'px';
});
chatTa.addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault();sendMessage();}
});

// ── Profile edit ─────────────────────────────────────────────────────────
function openProfileEdit(){
  if(!_agent) return;
  document.getElementById('editName').value = _agent.name||'';
  document.getElementById('editIcon').value = _agent.icon||'🤖';
  document.getElementById('editStatus').value = _agent.status||'onboarding';
  document.getElementById('profileModal').classList.add('show');
}
function closeProfileEdit(){document.getElementById('profileModal').classList.remove('show');}
document.getElementById('profileModal').addEventListener('click', e=>{
  if(e.target===document.getElementById('profileModal'))closeProfileEdit();
});
async function saveProfileEdit(){
  const name = document.getElementById('editName').value.trim();
  const icon = document.getElementById('editIcon').value.trim();
  const status = document.getElementById('editStatus').value;
  try{
    const r = await fetch(`${API}/api/agents/me`,{
      method:'PATCH', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, icon, status}),
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    _agent = await r.json();
    renderHeader();
    closeProfileEdit();
  }catch(e){
    alert('Не удалось сохранить: '+e.message);
  }
}

// Boot
document.addEventListener('DOMContentLoaded', async ()=>{
  loadBalance();
  const ok = await loadAgent();
  if(ok){
    await loadModules();
    await loadMessages();
  }
});
</script>

[alembic]
# Путь к скриптам миграций
script_location = alembic

# Шаблон имени версии: YYYYMMDD_HHMM_slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Запускать env.py из директории проекта
prepend_sys_path = .

# Версия БД определяется через alembic_version. Sqlalchemy URL читается из env.py
# через DATABASE_URL переменной окружения.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Опционально: запуск ruff после генерации миграции

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

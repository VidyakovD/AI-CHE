# Production nginx config для AI Студии Че.
# Скрипт migrate_setup.sh подменяет __DOMAIN__ на реальный (aiche.ru).
# После certbot --nginx добавит SSL-секцию автоматически.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Заголовок Server: nginx без версии
    server_tokens off;

    # Лимит размера загружаемого файла (RAG до 50 МБ + запас)
    client_max_body_size 50M;

    # Логи
    access_log /var/log/nginx/aiche-access.log;
    error_log  /var/log/nginx/aiche-error.log warn;

    # Безопасность: запрещаем доступ к dot-files (.git, .env etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Проксирование на FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Заголовки для определения IP юзера и протокола
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts: orchestra-runs могут идти долго, sites-генерация до 10 минут
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # SSE для orchestra-stream (без буферизации)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # Static files (uploads/) — отдаём напрямую, минуя FastAPI
    location /uploads/ {
        alias /root/AI-CHE/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Защита: не отдавать backup-файлы / .env-подобные
        location ~ \.(env|key|pem|sql)$ {
            deny all;
            return 404;
        }
    }

    # Фавиконка / иконка PWA — кэш на год
    location ~ ^/(favicon\.ico|favicon\.png|icon\.svg|logo-.*\.png)$ {
        proxy_pass http://127.0.0.1:8000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # icons.js, sw.js — PWA-критичные файлы
    location ~ ^/(icons|knowledge-ui)\.js$ {
        proxy_pass http://127.0.0.1:8000;
        expires 1h;  # часто обновляем — короткий TTL
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        # Service Worker — НЕ кэшируем (иначе апдейты не доходят)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

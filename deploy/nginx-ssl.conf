# Production nginx config с SSL для AI Студии Че.
# Используйте после получения сертификата через certbot.
# Замените __DOMAIN__ на реальный (aiche.ru).

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # ACME challenge (для будущих renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    # SSL сертификаты от certbot
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Modern SSL config (Mozilla intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: разрешает inline scripts (нам нужно для views/), unsafe-inline стилей
    # для Tailwind CDN. Если хотим жестче — переезжать на CSP nonces.
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' https://cdn.tailwindcss.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' data: blob:;" always;

    # Server tokens off — не палим версию nginx
    server_tokens off;
    client_max_body_size 50M;

    # Логи
    access_log /var/log/nginx/aiche-access.log;
    error_log  /var/log/nginx/aiche-error.log warn;

    # ACME challenge для renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Защита от dot-files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Главный proxy_pass на FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # Static uploads
    location /uploads/ {
        alias /root/AI-CHE/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        location ~ \.(env|key|pem|sql)$ {
            deny all;
            return 404;
        }
    }

    # PWA-критичные файлы
    location ~ ^/(favicon\.ico|favicon\.png|icon\.svg|logo-.*\.png)$ {
        proxy_pass http://127.0.0.1:8000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(icons|knowledge-ui)\.js$ {
        proxy_pass http://127.0.0.1:8000;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Service Worker — НЕ кэшируем
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        proxy_pass http://127.0.0.1:8000;
        expires 1d;
    }
}

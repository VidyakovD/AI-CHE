# Blue/green upstream config для AI Студии Че
#
# Вставить в /etc/nginx/sites-available/aiche.ru ВНЕ блоков server { }
# (обычно в начале файла, после комментариев) — ОДИН раз для всего host'а.
#
# Затем заменить все `proxy_pass http://127.0.0.1:8000;` на
# `proxy_pass http://ai_che_backend;` (см. ниже в комментариях).

# Upstream: основной (зелёный, 8000) + резервный (синий, 8001).
# - При запросе nginx сначала пытается green (8000)
# - Если 8000 не отвечает (502/504/timeout) — мгновенно retry на blue (8001)
# - Через 5 сек после fail зелёный считается dead → весь трафик на blue
# - Когда зелёный поднимется → nginx обратно перенаправляет primary
#
# Это делает деплой без 502: рестартуем blue (8001) → nginx продолжает
# через green. Когда blue готов — рестартуем green → nginx failover на blue.
#
# keepalive — пул соединений к upstream, снижает latency на handshake.

upstream ai_che_backend {
    # primary
    server 127.0.0.1:8000 max_fails=2 fail_timeout=5s;
    # backup — nginx посылает запросы сюда ТОЛЬКО если primary down
    server 127.0.0.1:8001 max_fails=2 fail_timeout=5s backup;

    # Connection pool — переиспользует TCP-соединения к gunicorn
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ──────────────────────────────────────────────────────────────────────────
# Изменения в server-блоке HTTPS:
#
# 1. Главный location /:
#     БЫЛО:
#         proxy_pass http://127.0.0.1:8000;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         ...
#     СТАЛО:
#         proxy_pass http://ai_che_backend;
#         proxy_http_version 1.1;
#         proxy_set_header Connection "";
#         proxy_set_header Host $host;
#         ...
#         # КЛЮЧЕВОЕ для blue/green: retry на следующий upstream при failure.
#         proxy_next_upstream error timeout http_502 http_503 http_504;
#         proxy_next_upstream_tries 2;
#         proxy_next_upstream_timeout 10s;
#
# 2. Прочие location'ы с proxy_pass http://127.0.0.1:8000 → http://ai_che_backend
#    (favicon/icons/sw.js/manifest — там же).
#
# 3. Сохрани все остальные proxy_set_header / proxy_buffering off / etc.
